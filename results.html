<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="author" content="Anna Fagan">
        <meta name="robots" content="noindex, nofollow">
        <link href="style.css" rel="stylesheet" type="text/css">
        <title>Results</title>
    </head>
    <body>
        <div id="results" class="block"></div>
        <a href="index.html">Back to Form</a>
        <script>
            const resultsList = document.getElementById('results')
            new URLSearchParams(window.location.search).forEach((firstName, email, age, birthday, phoneNumber, winter, summer, username, nightTime, dayTime, faveDay, password, opinion)=>{
                resultsList.append(`${firstName}`)
                resultsList.append(document.createElement('br'))
            });
        </script>
    </body>
</html>
